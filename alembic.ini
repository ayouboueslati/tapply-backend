# alembic.ini — Alembic configuration for Tapply
#
# Do NOT put credentials here.  The database URL is read dynamically in
# alembic/env.py from the MIGRATION_DATABASE_URL environment variable
# (falling back to DATABASE_URL).  The placeholder below is intentionally
# invalid so that a mis-configured run fails loudly.

[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
truncate_slug_length = 40
revision_environment = false
sourceless = false
version_locations = %(here)s/alembic/versions
version_path_separator = os
output_encoding = utf-8

# Intentionally left invalid — env.py overrides this from environment variables.
sqlalchemy.url = postgresql://REPLACE_VIA_ENV

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
